apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: sonar.mathrix.tech-certificate
  namespace: default
spec:
  secretName: sonar.mathrix.tech-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: sonar.mathrix.tech
  dnsNames:
  - sonar.mathrix.tech
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - sonar.mathrix.tech
