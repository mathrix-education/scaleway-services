apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: sentry.mathrix.tech-certificate
  namespace: default
spec:
  secretName: sentry.mathrix.tech-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: sentry.mathrix.tech
  dnsNames:
  - sentry.mathrix.tech
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - sentry.mathrix.tech
